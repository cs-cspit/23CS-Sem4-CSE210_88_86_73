<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shelf - Login & Signup</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: var(--gray-100);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: linear-gradient(rgba(46, 125, 50, 0.4), rgba(46, 125, 50, 0.4)), 
                url('https://img.freepik.com/premium-photo/woman-hand-hold-supermarket-shopping-cart-with-fresh-fruit-vegetable-shelves-grocery-store_293060-6001.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
        }
        
        .auth-container {
            width: 100%;
            max-width: 450px;
            background-color: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            animation: fadeIn 0.6s ease;
            border: 1px solid var(--gray-200);
        }
        
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--gray-200);
        }
        
        .tab {
            flex: 1;
            text-align: center;
            padding: 18px 15px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            color: var(--gray-700);
            position: relative;
            overflow: hidden;
        }
        
        .tab::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 3px;
            background-color: var(--primary);
            transition: var(--transition);
        }
        
        .tab:hover {
            color: var(--primary);
        }
        
        .tab:hover::after {
            width: 60%;
        }
        
        .tab.active {
            background-color: var(--primary);
            color: white;
        }
        
        .tab.active::after {
            width: 100%;
            background-color: var(--secondary);
        }
        
        .tab-content {
            display: none;
            padding: 30px;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeInUp 0.4s ease;
        }
        
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--gray-700);
            font-size: 15px;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid var(--gray-300);
            border-radius: var(--radius);
            font-size: 16px;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
        }
        
        .form-group .input-icon {
            position: absolute;
            left: 15px;
            top: 43px;
            color: var(--gray-500);
            font-size: 18px;
        }
        
        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.2);
        }
        
        .form-group .error {
            color: var(--danger);
            font-size: 14px;
            margin-top: 5px;
            display: none;
            padding-left: 5px;
            font-weight: 500;
        }
        
        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: var(--radius);
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .submit-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .brand {
            text-align: center;
            margin-bottom: 20px;
            padding: 30px 0 15px;
        }
        
        .brand .logo {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 10px;
        }
        
        .brand h1 {
            color: var(--primary);
            margin: 0;
            font-size: 32px;
            font-weight: 700;
        }
        
        .brand p {
            color: var(--gray-600);
            margin: 8px 0 0;
        }
        
        .or-divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: var(--gray-500);
            font-size: 14px;
        }
        
        .or-divider::before, .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--gray-300);
        }
        
        .or-divider::before {
            margin-right: 15px;
        }
        
        .or-divider::after {
            margin-left: 15px;
        }
        
        .guest-login {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: var(--gray-600);
            text-decoration: none;
            font-size: 14px;
            transition: var(--transition);
        }
        
        .guest-login:hover {
            color: var(--primary);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        #login-error, #signup-error {
            color: var(--danger);
            text-align: center;
            padding: 8px 12px;
            margin-bottom: 15px;
            border-radius: var(--radius);
            font-size: 14px;
            display: none;
            background-color: rgba(220, 53, 69, 0.1);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="brand">
            <div class="logo"><i class="fas fa-leaf"></i></div>
            <h1>Smart Shelf</h1>
            <p>Reducing Food Waste, Increasing Profits</p>
        </div>
        
        <div class="tabs">
            <div class="tab active" id="login-tab"><i class="fas fa-sign-in-alt"></i> Login</div>
            <div class="tab" id="signup-tab"><i class="fas fa-user-plus"></i> Sign Up</div>
        </div>
        
        <div class="tab-content active" id="login-content">
            <div id="login-error"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="login-email" placeholder="Enter your email address" required>
                    <div class="error" id="login-email-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                    <div class="error" id="login-password-error"></div>
                </div>
                
                <button type="submit" class="submit-btn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            
            <div class="or-divider">or</div>
            
            <a href="main.html" class="guest-login">Continue as Guest</a>
        </div>
        
        <div class="tab-content" id="signup-content">
            <div id="signup-error"></div>
            
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="signup-name" placeholder="Enter your full name" required>
                    <div class="error" id="signup-name-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="signup-email" placeholder="Enter your email address" required>
                    <div class="error" id="signup-email-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="signup-phone">Phone Number (10 digits)</label>
                    <i class="fas fa-phone input-icon"></i>
                    <input type="tel" id="signup-phone" placeholder="Enter 10-digit number (e.g., 9876543210)" required>
                    <div class="error" id="signup-phone-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="signup-password" placeholder="Minimum 6 characters" required>
                    <div class="error" id="signup-password-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="signup-confirm-password">Confirm Password</label>
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="signup-confirm-password" placeholder="Re-enter your password" required>
                    <div class="error" id="signup-confirm-password-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="signup-role">I am a</label>
                    <i class="fas fa-user-tag input-icon"></i>
                    <select id="signup-role" required>
                        <option value="" disabled>Select your role</option>
                        <option value="customer" selected>Customer</option>
                        <option value="retailer">Retailer</option>
                    </select>
                    <div class="error" id="signup-role-error"></div>
                </div>
                
                <button type="submit" class="submit-btn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>
            
            <div class="or-divider">or</div>
            
            <a href="main.html" class="guest-login">Continue as Guest</a>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if redirectBasedOnRole function exists
            if (typeof redirectBasedOnRole !== 'function') {
                console.error('redirectBasedOnRole function not found. Make sure auth.js is loaded correctly.');
            }
            
            // Check if apiCall function exists
            if (typeof apiCall !== 'function') {
                console.error('apiCall function not found. Make sure auth.js is loaded correctly.');
            }
            
            // Check if user is already logged in
            if (isAuthenticated()) {
                const user = getCurrentUser();
                if (user && user.role) {
                    redirectBasedOnRole(user.role);
                    return;
                }
            }
            
            // Tab navigation
            const loginTab = document.getElementById('login-tab');
            const signupTab = document.getElementById('signup-tab');
            const loginContent = document.getElementById('login-content');
            const signupContent = document.getElementById('signup-content');
            
            loginTab.addEventListener('click', function() {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                loginContent.classList.add('active');
                signupContent.classList.remove('active');
            });
            
            signupTab.addEventListener('click', function() {
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                signupContent.classList.add('active');
                loginContent.classList.remove('active');
            });
            
            // Login form submission
            const loginForm = document.getElementById('login-form');
            
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Clear previous errors
                clearError('login-email-error');
                clearError('login-password-error');
                clearError('login-error');
                
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                
                // Basic validation
                if (!email) {
                    showError('login-email-error', 'Email is required');
                    return;
                }
                
                if (!password) {
                    showError('login-password-error', 'Password is required');
                    return;
                }
                
                // Attempt login
                try {
                    document.getElementById('login-error').style.display = 'none';
                    
                    // Disable login button and show loading
                    const loginButton = loginForm.querySelector('button[type="submit"]');
                    const originalText = loginButton.innerHTML;
                    loginButton.disabled = true;
                    loginButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
                    
                    const response = await apiCall('/auth/login', 'POST', { email, password });
                    
                    if (response && response.success) {
                        // Store auth token and user data
                        localStorage.setItem('auth_token', response.data.token);
                        localStorage.setItem('user_data', JSON.stringify(response.data.user));
                        
                        // Also store individual fields for easy access
                        localStorage.setItem('userId', response.data.user.id);
                        localStorage.setItem('userName', response.data.user.name);
                        localStorage.setItem('userEmail', response.data.user.email);
                        localStorage.setItem('userRole', response.data.user.role);
                        
                        // Redirect based on role
                        redirectBasedOnRole(response.data.user.role);
                    } else {
                        // Failed login
                        loginButton.disabled = false;
                        loginButton.innerHTML = originalText;
                        showError('login-error', response.message || 'Invalid email or password');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    loginButton.disabled = false;
                    loginButton.innerHTML = originalText;
                    showError('login-error', 'An error occurred. Please try again.');
                }
            });
            
            // Signup form submission
            const signupForm = document.getElementById('signup-form');
            
            signupForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Clear previous errors
                clearError('signup-name-error');
                clearError('signup-email-error');
                clearError('signup-phone-error');
                clearError('signup-password-error');
                clearError('signup-confirm-password-error');
                clearError('signup-role-error');
                clearError('signup-error');
                
                const name = document.getElementById('signup-name').value;
                const email = document.getElementById('signup-email').value;
                const phone = document.getElementById('signup-phone').value;
                const password = document.getElementById('signup-password').value;
                const confirmPassword = document.getElementById('signup-confirm-password').value;
                const role = document.getElementById('signup-role').value;
                
                // Basic validation
                if (!name) {
                    showError('signup-name-error', 'Name is required');
                    return;
                }
                
                if (!email) {
                    showError('signup-email-error', 'Email is required');
                    return;
                }
                
                if (!phone) {
                    showError('signup-phone-error', 'Phone number is required');
                    return;
                }
                
                // Basic phone number validation (10 digits)
                const phonePattern = /^\d{10}$/;
                if (!phonePattern.test(phone.replace(/[-()\s]/g, ''))) {
                    showError('signup-phone-error', 'Please enter a valid 10-digit phone number');
                    return;
                }
                
                if (!password) {
                    showError('signup-password-error', 'Password is required');
                    return;
                }
                
                if (password.length < 6) {
                    showError('signup-password-error', 'Password must be at least 6 characters');
                    return;
                }
                
                if (password !== confirmPassword) {
                    showError('signup-confirm-password-error', 'Passwords do not match');
                    return;
                }
                
                // Prepare user data
                const userData = {
                    name,
                    email,
                    phone,
                    password,
                    confirmPassword,
                    role
                };
                
                // Attempt signup
                try {
                    // Disable signup button and show loading
                    const signupButton = signupForm.querySelector('button[type="submit"]');
                    const originalText = signupButton.innerHTML;
                    signupButton.disabled = true;
                    signupButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
                    
                    const response = await apiCall('/auth/signup', 'POST', userData);
                    
                    if (response && response.success) {
                        // Store auth token and user data
                        localStorage.setItem('auth_token', response.data.token);
                        localStorage.setItem('user_data', JSON.stringify(response.data.user));
                        
                        // Also store individual fields for easy access
                        localStorage.setItem('userId', response.data.user.id);
                        localStorage.setItem('userName', response.data.user.name);
                        localStorage.setItem('userEmail', response.data.user.email);
                        localStorage.setItem('userRole', response.data.user.role);
                        
                        // Redirect based on role
                        redirectBasedOnRole(response.data.user.role);
                    } else {
                        // Failed signup
                        signupButton.disabled = false;
                        signupButton.innerHTML = originalText;
                        showError('signup-error', response.message || 'Failed to create account. Email may already be in use.');
                    }
                } catch (error) {
                    console.error('Signup error:', error);
                    signupButton.disabled = false;
                    signupButton.innerHTML = originalText;
                    showError('signup-error', 'An error occurred. Please try again.');
                }
            });
            
            // Show error messages
            window.showError = function(id, message) {
                const errorElement = document.getElementById(id);
                errorElement.textContent = message;
                errorElement.style.display = 'block';
                
                if (id === 'login-error' || id === 'signup-error') {
                    errorElement.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
                }
            };
            
            // Clear error messages
            window.clearError = function(id) {
                const errorElement = document.getElementById(id);
                errorElement.textContent = '';
                errorElement.style.display = 'none';
            };
        });
    </script>
</body>
</html>
