<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shelf - Surplus Management</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-card h3 {
            margin-top: 0;
            color: #333;
            font-size: 16px;
        }
        
        .stat-card .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            margin: 10px 0;
        }
        
        .stat-card.warning .stat-value {
            color: #FF9800;
        }
        
        .stat-card.danger .stat-value {
            color: #F44336;
        }
        
        .recommendations {
            margin-top: 30px;
        }
        
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .product-card {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .product-card h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .product-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: #666;
            font-size: 14px;
        }
        
        .discount-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #FF9800;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        
        .recommendation-badge {
            background-color: #4CAF50;
            color: white;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 10px;
        }
        
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status-near-expiry {
            color: #FF9800;
            font-weight: bold;
        }
        
        .status-expired {
            color: #F44336;
            font-weight: bold;
        }
        
        .search-container {
            max-width: 300px;
        }
        
        .search-input {
            border-radius: 20px;
            padding-right: 15px;
        }
        
        .input-icon {
            position: relative;
        }
        
        .input-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-500);
        }
        
        .input-icon input {
            padding-left: 45px;
        }
        
        .product-summary {
            background-color: var(--gray-100);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary);
        }
        
        .product-summary-title {
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .product-summary-details {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        
        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: var(--gray-300);
            outline: none;
            margin: 15px 0;
        }
        
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }
        
        .range-value-container {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 15px;
        }
        
        .discount-preview {
            background-color: var(--gray-100);
            border-radius: var(--radius);
            padding: 15px;
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
        }
        
        .original-price-display {
            color: var(--gray-600);
            text-decoration: line-through;
        }
        
        .new-price-display {
            color: var(--primary);
            font-weight: 600;
            font-size: 18px;
        }
        
        .savings-display {
            color: var(--secondary);
            font-weight: 600;
        }
        
        .features-list {
            margin: 20px 0;
            padding-left: 20px;
        }
        
        .features-list li {
            margin-bottom: 10px;
            list-style-type: none;
        }
        
        .features-list li i {
            color: var(--primary);
            margin-right: 10px;
        }
        
        .option-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .option-btn {
            flex: 1;
            min-width: 120px;
            padding: 10px;
            background: var(--gray-200);
            border: 2px solid var(--gray-300);
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
        }
        
        .option-btn.active {
            background: var(--primary-light);
            color: white;
            border-color: var(--primary);
        }
        
        .recommendation-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid var(--gray-200);
            transition: var(--transition);
        }
        
        .recommendation-card:hover {
            box-shadow: var(--shadow);
        }
        
        .recommendation-header {
            background: var(--gray-200);
            padding: 15px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .recommendation-header .category {
            color: var(--gray-700);
            background: var(--gray-100);
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 14px;
        }
        
        .recommendation-body {
            padding: 15px;
        }
        
        .recommendation-insight {
            background: rgba(23, 162, 184, 0.1);
            border-radius: var(--radius);
            padding: 10px 15px;
            margin-bottom: 15px;
            border-left: 4px solid var(--info);
            font-size: 14px;
            color: var(--gray-800);
        }
        
        .recommendation-insight i {
            color: var(--info);
            margin-right: 5px;
        }
        
        .recommendation-data {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .data-item {
            flex: 1;
            min-width: 100px;
            text-align: center;
            padding: 10px;
            background: var(--gray-100);
            border-radius: var(--radius);
        }
        
        .data-item .label {
            font-size: 12px;
            color: var(--gray-600);
            margin-bottom: 5px;
        }
        
        .data-item .value {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-900);
        }
        
        .expiry-table {
            width: 100%;
            margin-top: 20px;
        }
        
        .expiry-table th {
            white-space: nowrap;
        }
        
        .expiry-days {
            font-weight: 600;
        }
        
        .expiry-days.critical {
            color: var(--danger);
        }
        
        .expiry-days.warning {
            color: var(--warning);
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .action-buttons .btn {
            padding: 8px 12px;
            font-size: 14px;
        }
        
        .no-recommendations {
            text-align: center;
            padding: 30px;
            color: var(--gray-600);
        }
        
        .no-recommendations i {
            font-size: 48px;
            margin-bottom: 15px;
            color: var(--gray-400);
        }
        
        .no-products {
            text-align: center;
            padding: 30px;
            color: var(--gray-600);
        }
        
        .no-products i {
            font-size: 48px;
            margin-bottom: 15px;
            color: var(--gray-400);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="retailer.html" class="brand">Smart Shelf</a>
        <div class="menu">
            <a href="retailer.html">Dashboard</a>
            <a href="inventory.html">Inventory</a>
            <a href="surplus_m.html" class="active">Surplus Management</a>
            <a href="addinventory.html">Add New Product</a>
            <a href="#" id="logout-link">Logout</a>
        </div>
        <div class="user-info">
            <span>Welcome, <span class="user-name" id="user-name">Retailer</span></span>
        </div>
    </div>

    <div class="container">
        <h1 class="page-title">Surplus Management</h1>
        
        <div id="dashboard-content">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>Loading surplus data...</p>
            </div>
        </div>
        
        <div class="recommendations">
            <h2>Recommended Actions</h2>
            <div id="recommendations-content">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Loading recommendations...</p>
                </div>
            </div>
        </div>
        
        <div class="near-expiry-products">
            <h2>Near Expiry Products</h2>
            <div id="near-expiry-content">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Loading near expiry products...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Discount Modal -->
    <div id="discount-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Apply Discount</h2>
            <form id="apply-discount-form">
                <input type="hidden" id="product-id">
                
                <div class="form-group">
                    <label for="product-name-display">Product</label>
                    <input type="text" id="product-name-display" readonly>
                </div>
                
                <div class="form-group">
                    <label for="discount-percentage">Discount Percentage (%)</label>
                    <input type="number" id="discount-percentage" min="1" max="100" value="20" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn">Apply Discount</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Auto Discount Modal -->
    <div id="auto-discount-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Auto-Apply Discounts</h2>
            <form id="auto-discount-form">
                <div class="form-group">
                    <label for="expiry-days">Apply to products expiring within (days)</label>
                    <input type="number" id="expiry-days" min="1" max="30" value="7" required>
                </div>
                
                <div class="form-group">
                    <label for="auto-discount-percentage">Discount Percentage (%)</label>
                    <input type="number" id="auto-discount-percentage" min="1" max="100" value="25" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn">Auto-Apply Discounts</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Add styles for modal
        const modalStyles = document.createElement('style');
        modalStyles.textContent = `
            .modal {
                display: none;
                position: fixed;
                z-index: 1050;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                overflow: auto;
                background-color: rgba(0,0,0,0.5);
            }
            
            .modal-content {
                background-color: white;
                margin: 10% auto;
                padding: 20px;
                border-radius: 8px;
                width: 50%;
                max-width: 600px;
            }
            
            .close {
                color: #aaa;
                float: right;
                font-size: 28px;
                font-weight: bold;
                cursor: pointer;
            }
            
            .close:hover {
                color: black;
            }
            
            .form-actions {
                display: flex;
                justify-content: space-between;
                margin-top: 20px;
            }
            
            .btn-success {
                background-color: #4CAF50;
                color: white;
            }
            
            .btn-warning {
                background-color: #FF9800;
                color: white;
            }
            
            .btn-danger {
                background-color: #F44336;
                color: white;
            }
        `;
        document.head.appendChild(modalStyles);
        
        // Protect page - only retailers can access
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is authenticated and is a retailer
            if (!protectPage(['retailer'])) {
                return;
            }
            
            // Set user name
            const user = getCurrentUser();
            document.getElementById('user-name').textContent = user.name;
            
            // Add logout listener
            document.getElementById('logout-link').addEventListener('click', function(e) {
                e.preventDefault();
                logout();
            });
            
            // Get modal elements
            const discountModal = document.getElementById('discount-modal');
            const autoDiscountModal = document.getElementById('auto-discount-modal');
            const closeButtons = document.querySelectorAll('.close');
            
            // Close modals when X is clicked
            closeButtons.forEach(btn => {
                btn.onclick = function() {
                    discountModal.style.display = 'none';
                    autoDiscountModal.style.display = 'none';
                };
            });
            
            // Close modals when clicked outside
            window.onclick = function(event) {
                if (event.target === discountModal) {
                    discountModal.style.display = 'none';
                }
                if (event.target === autoDiscountModal) {
                    autoDiscountModal.style.display = 'none';
                }
            };
            
            // Add submit handler to discount form
            document.getElementById('apply-discount-form').addEventListener('submit', applyDiscount);
            
            // Add submit handler to auto-discount form
            document.getElementById('auto-discount-form').addEventListener('submit', applyAutoDiscount);
            
            // Load surplus data
            loadSurplusDashboard();
            loadNearExpiryProducts();
            loadRecommendations();
        });
        
        async function loadSurplusDashboard() {
            const dashboardContent = document.getElementById('dashboard-content');
            
            try {
                // Get surplus dashboard data
                const response = await apiCall('/surplus/dashboard');
                
                if (!response || !response.success) {
                    throw new Error('Failed to load surplus dashboard data');
                }
                
                const data = response.data;
                
                // Render dashboard stats
                dashboardContent.innerHTML = `
                    <div class="dashboard-stats">
                        <div class="stat-card">
                            <h3>Near Expiry Products</h3>
                            <div class="stat-value warning">${data.nearExpiryCount}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Expired Products</h3>
                            <div class="stat-value danger">${data.expiredCount}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Currently Discounted</h3>
                            <div class="stat-value">${data.discountedCount}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Expiring Today</h3>
                            <div class="stat-value warning">${data.expiringToday}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Potential Loss Value</h3>
                            <div class="stat-value danger">${formatCurrency(data.potentialLoss)}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Savings Through Discounts</h3>
                            <div class="stat-value">${formatCurrency(data.savedValue)}</div>
                        </div>
                    </div>
                    
                    <div class="actions">
                        <button class="btn btn-warning" id="auto-discount-btn">
                            Auto-Apply Discounts
                        </button>
                    </div>
                `;
                
                // Add click handler for auto-discount button
                document.getElementById('auto-discount-btn').addEventListener('click', function() {
                    document.getElementById('auto-discount-modal').style.display = 'block';
                });
                
            } catch (error) {
                console.error('Surplus dashboard loading error:', error);
                dashboardContent.innerHTML = `
                    <div class="error-container">
                        <p>Failed to load surplus dashboard data. Please try again.</p>
                        <button class="btn" onclick="window.location.reload()">Reload</button>
                    </div>
                `;
            }
        }
        
        async function loadNearExpiryProducts() {
            const nearExpiryContent = document.getElementById('near-expiry-content');
            
            try {
                // Get near expiry products
                const response = await apiCall('/surplus/needs-attention');
                
                if (!response || !response.success) {
                    throw new Error('Failed to load near expiry products');
                }
                
                const products = response.data;
                
                if (!products || products.length === 0) {
                    nearExpiryContent.innerHTML = `
                        <div class="card">
                            <div class="card-body" style="text-align: center;">
                                <p>No near expiry products requiring attention.</p>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                // Render near expiry products
                nearExpiryContent.innerHTML = `
                    <div class="table-container">
    <table>
        <thead>
            <tr>
                                    <th>Name</th>
                <th>Category</th>
                                    <th>Price</th>
                <th>Quantity</th>
                <th>Expiry Date</th>
                                    <th>Days Left</th>
                <th>Actions</th>
            </tr>
        </thead>
                            <tbody>
                                ${products.map(product => {
                                    const daysLeft = daysBetween(new Date(), new Date(product.expiryDate));
                                    
                                    return `
                                    <tr>
                                        <td>${product.name}</td>
                                        <td>${product.category}</td>
                                        <td>${formatCurrency(product.price)}</td>
                                        <td>${product.quantity}</td>
                                        <td>${formatDate(product.expiryDate)}</td>
                                        <td class="status-near-expiry">${daysLeft} days</td>
                                        <td>
                                            <button class="btn btn-warning apply-discount-btn" data-id="${product._id}" data-name="${product.name}">
                                                Apply Discount
                                            </button>
                                        </td>
                                    </tr>
                                    `;
                                }).join('')}
        </tbody>
    </table>
                    </div>
                `;
                
                // Add click handlers to discount buttons
                document.querySelectorAll('.apply-discount-btn').forEach(button => {
                    button.addEventListener('click', function() {
                        const productId = this.getAttribute('data-id');
                        const productName = this.getAttribute('data-name');
                        openDiscountModal(productId, productName);
                    });
                });
                
            } catch (error) {
                console.error('Near expiry products loading error:', error);
                nearExpiryContent.innerHTML = `
                    <div class="error-container">
                        <p>Failed to load near expiry products. Please try again.</p>
                        <button class="btn" onclick="window.location.reload()">Reload</button>
                    </div>
                `;
            }
        }
        
        async function loadRecommendations() {
            const recommendationsContent = document.getElementById('recommendations-content');
            
            try {
                // Get discount recommendations
                const response = await apiCall('/surplus/recommendations');
                
                if (!response || !response.success) {
                    throw new Error('Failed to load recommendations');
                }
                
                const recommendations = response.data;
                
                if (!recommendations || recommendations.length === 0) {
                    recommendationsContent.innerHTML = `
                        <div class="card">
                            <div class="card-body" style="text-align: center;">
                                <p>No discount recommendations at this time.</p>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                // Render recommendations
                recommendationsContent.innerHTML = `
                    <div class="card-grid">
                        ${recommendations.map(rec => {
                            return `
                            <div class="product-card">
                                <h3>${rec.product.name}</h3>
                                <div class="product-meta">
                                    <span>Category: ${rec.product.category}</span>
                                    <span>Price: ${formatCurrency(rec.product.price)}</span>
                                </div>
                                <div class="product-meta">
                                    <span>Expires in: ${rec.daysUntilExpiry} days</span>
                                    <span>Qty: ${rec.product.quantity}</span>
                                </div>
                                <div class="recommendation-info">
                                    <strong>Recommended discount: 
                                        <span class="recommendation-badge">${rec.recommendedDiscount}%</span>
                                    </strong>
                                    <p>${rec.reason}</p>
                                </div>
                                <div class="actions">
                                    <button class="btn apply-recommendation-btn" data-id="${rec.product._id}" data-discount="${rec.recommendedDiscount}">
                                        Apply ${rec.recommendedDiscount}% Discount
                                    </button>
                                </div>
                            </div>
                            `;
                        }).join('')}
                    </div>
                    
                    <div class="actions" style="margin-top: 20px;">
                        <button class="btn btn-success" id="apply-all-recommendations-btn">
                            Apply All Recommendations
                        </button>
                    </div>
                `;
                
                // Add click handlers to recommendation buttons
                document.querySelectorAll('.apply-recommendation-btn').forEach(button => {
                    button.addEventListener('click', function() {
                        const productId = this.getAttribute('data-id');
                        const discountPercentage = parseInt(this.getAttribute('data-discount'));
                        applyRecommendation(productId, discountPercentage);
                    });
                });
                
                // Add click handler for apply all button
                document.getElementById('apply-all-recommendations-btn').addEventListener('click', applyAllRecommendations);
                
            } catch (error) {
                console.error('Recommendations loading error:', error);
                recommendationsContent.innerHTML = `
                    <div class="error-container">
                        <p>Failed to load recommendations. Please try again.</p>
                        <button class="btn" onclick="window.location.reload()">Reload</button>
                    </div>
                `;
            }
        }
        
        function openDiscountModal(productId, productName) {
            document.getElementById('product-id').value = productId;
            document.getElementById('product-name-display').value = productName;
            document.getElementById('discount-modal').style.display = 'block';
        }
        
        async function applyDiscount(e) {
            e.preventDefault();
            
            const productId = document.getElementById('product-id').value;
            const discountPercentage = parseInt(document.getElementById('discount-percentage').value);
            
            try {
                // Apply discount to product
                const response = await apiCall(`/products/${productId}/discount`, 'PATCH', { discountPercentage });
                
                if (response && response.success) {
                    // Close modal
                    document.getElementById('discount-modal').style.display = 'none';
                    
                    // Reload data
                    await Promise.all([
                        loadSurplusDashboard(),
                        loadNearExpiryProducts(),
                        loadRecommendations()
                    ]);
                    
                    alert('Discount applied successfully');
                } else {
                    alert('Failed to apply discount: ' + (response?.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Apply discount error:', error);
                alert('Error applying discount. Please try again.');
            }
        }
        
        async function applyRecommendation(productId, discountPercentage) {
            try {
                // Apply discount to product
                const response = await apiCall(`/products/${productId}/discount`, 'PATCH', { discountPercentage });
                
                if (response && response.success) {
                    // Reload data
                    await Promise.all([
                        loadSurplusDashboard(),
                        loadNearExpiryProducts(),
                        loadRecommendations()
                    ]);
                    
                    alert('Discount applied successfully');
                } else {
                    alert('Failed to apply discount: ' + (response?.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Apply recommendation error:', error);
                alert('Error applying discount. Please try again.');
            }
        }
        
        async function applyAllRecommendations() {
            try {
                // Get all recommendations
                const response = await apiCall('/surplus/recommendations');
                
                if (!response || !response.success) {
                    throw new Error('Failed to get recommendations');
                }
                
                const recommendations = response.data.map(rec => ({
                    productId: rec.product._id,
                    discountPercentage: rec.recommendedDiscount
                }));
                
                if (recommendations.length === 0) {
                    alert('No recommendations to apply');
                    return;
                }
                
                // Apply all recommendations
                const result = await apiCall('/surplus/apply-recommendations', 'POST', { recommendations });
                
                if (result && result.success) {
                    // Reload data
                    await Promise.all([
                        loadSurplusDashboard(),
                        loadNearExpiryProducts(),
                        loadRecommendations()
                    ]);
                    
                    alert(`Applied ${recommendations.length} recommendations successfully`);
                } else {
                    alert('Failed to apply recommendations: ' + (result?.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Apply all recommendations error:', error);
                alert('Error applying recommendations. Please try again.');
            }
        }
        
        async function applyAutoDiscount(e) {
            e.preventDefault();
            
            const expiryDays = parseInt(document.getElementById('expiry-days').value);
            const discountPercentage = parseInt(document.getElementById('auto-discount-percentage').value);
            
            try {
                // Auto-apply discounts
                const response = await apiCall('/surplus/auto-discount', 'PATCH', { 
                    expiryDays, 
                    discountPercentage 
                });
                
                if (response && response.success) {
                    // Close modal
                    document.getElementById('auto-discount-modal').style.display = 'none';
                    
                    // Reload data
                    await Promise.all([
                        loadSurplusDashboard(),
                        loadNearExpiryProducts(),
                        loadRecommendations()
                    ]);
                    
                    alert(`Auto-applied ${response.count} discounts successfully`);
                } else {
                    alert('Failed to auto-apply discounts: ' + (response?.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Auto-discount error:', error);
                alert('Error auto-applying discounts. Please try again.');
            }
        }
    </script>
</body>
</html>
