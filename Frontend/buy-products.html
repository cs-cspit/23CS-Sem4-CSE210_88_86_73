<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shelf - Buy Products</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--gray-100);
            background-image: linear-gradient(rgba(46, 125, 50, 0.4), rgba(46, 125, 50, 0.4)), 
                url('https://indian-retailer.s3.ap-south-1.amazonaws.com/s3fs-public/2024-07/Top%20Grocery%20Brands%20in%20India_0.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: var(--gray-800);
            padding-top: 80px;
            min-height: 100vh;
        }

        .navbar {
            width: 100%;
            background: rgba(33, 37, 41, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .navbar .brand {
            color: white;
            font-size: 28px;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
        }

        .navbar .brand::before {
            content: '🌱';
            margin-right: 10px;
        }

        .navbar .menu {
            display: flex;
            gap: 10px;
        }

        .navbar .menu a {
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            color: white;
            padding: 10px 18px;
            border-radius: var(--radius);
            transition: var(--transition);
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar .menu a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .navbar .menu a.sale-link {
            background-image: linear-gradient(45deg, var(--secondary-light), var(--secondary));
            color: white;
            animation: pulse 2s infinite;
            box-shadow: 0 0 15px rgba(255, 111, 0, 0.5);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 111, 0, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(255, 111, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 111, 0, 0);
            }
        }

        .page-header {
            text-align: center;
            color: white;
            margin: 40px 0;
            animation: fadeInDown 1s ease;
        }

        .page-header h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .page-header p {
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            animation: fadeInUp 1s ease;
        }

        .search-filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-filters .form-group {
            flex: 1;
            min-width: 200px;
            margin-bottom: 0;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-500);
        }

        .input-icon input {
            padding-left: 45px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--gray-200);
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th, td {
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid var(--gray-300);
        }

        th {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        th:first-child {
            border-top-left-radius: var(--radius-sm);
        }

        th:last-child {
            border-top-right-radius: var(--radius-sm);
        }

        tr:nth-child(even) {
            background-color: var(--gray-100);
        }

        tr:hover {
            background-color: rgba(46, 125, 50, 0.05);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }

        .status-fresh {
            background-color: var(--success);
            color: white;
        }

        .status-near-expiry {
            background-color: var(--warning);
            color: var(--gray-900);
        }

        .quantity-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            background-color: var(--gray-200);
            color: var(--gray-800);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
        }

        .quantity-btn:hover {
            background-color: var(--primary-light);
            color: white;
        }

        .quantity-input {
            width: 50px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            border: 2px solid var(--gray-300);
            border-radius: var(--radius);
            padding: 4px;
        }

        .buy-btn {
            background-color: var(--primary);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
            margin: 0 auto;
        }

        .buy-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 32px;
            }
            
            .container {
                padding: 20px;
                margin: 20px;
            }
            
            th, td {
                padding: 12px 8px;
                font-size: 14px;
            }
        }

        .alert-success {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--success);
            color: white;
            padding: 15px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            z-index: 1000;
            animation: slideIn 0.3s ease;
            max-width: 350px;
        }
        
        .alert-content {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .alert-content i {
            font-size: 24px;
        }
        
        .alert-actions {
            display: flex;
            gap: 10px;
        }
        
        .alert-actions button {
            padding: 8px 12px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.3);
            color: white;
            transition: background-color 0.2s;
        }
        
        .alert-actions button:hover {
            background-color: rgba(255, 255, 255, 0.5);
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="customer.html" class="brand">Smart Shelf</a>
        <div class="menu">
            <a href="customer.html"><i class="fas fa-home"></i> Home</a>
            <a href="buy-products.html" class="active"><i class="fas fa-shopping-basket"></i> Products</a>
            <a href="sale.html" class="sale-link"><i class="fas fa-tags"></i> SALE</a>
            <a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart</a>
            <a href="orders.html"><i class="fas fa-box"></i> Orders</a>
            <a href="login-signup.html" id="login-link"><i class="fas fa-sign-in-alt"></i> Login</a>
            <a href="#" id="logout-link" style="display: none;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            <span id="user-info" style="display: none; color: white; padding: 10px 18px; align-items: center; gap: 8px;">
                <i class="fas fa-user"></i> <span id="user-name"></span>
            </span>
        </div>
    </div>

    <div class="page-header">
        <h1>Fresh Products</h1>
        <p>Browse our selection of high-quality products</p>
    </div>

    <div class="container">
        <div class="search-filters">
            <div class="form-group">
                <div class="input-icon">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search products...">
                </div>
            </div>
            
            <div class="form-group">
                <select id="category-filter">
                    <option value="">All Categories</option>
                    <option value="Dairy">Dairy</option>
                    <option value="Fruits">Fruits</option>
                    <option value="Vegetables">Vegetables</option>
                    <option value="Baked goods">Baked goods</option>
                    <option value="Grains">Grains</option>
                    <option value="Beverages">Beverages</option>
                    <option value="Snacks">Snacks</option>
                    <option value="Condiments">Condiments</option>
                </select>
            </div>
            
            <div class="form-group">
                <select id="status-filter">
                    <option value="">All Status</option>
                    <option value="Fresh">Fresh</option>
                    <option value="Near Expiry">Near Expiry</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table id="products-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Available</th>
                        <th>Status</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Products will be loaded dynamically from the API -->
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 30px;">
                            <div class="loading-spinner">
                                <div class="spinner"></div>
                                <p>Loading products...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Global products array
        let allProducts = [];
        
        // Fetch products on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication status
            const user = getCurrentUser();
            if (user) {
                document.getElementById('login-link').style.display = 'none';
                document.getElementById('logout-link').style.display = 'block';
                document.getElementById('user-name').textContent = user.name;
                document.getElementById('user-info').style.display = 'flex';
            }
            
            // Add logout listener
            document.getElementById('logout-link').addEventListener('click', function(e) {
                e.preventDefault();
                logout();
            });
            
            // Initialize filters
            const searchInput = document.getElementById('search-input');
            const categoryFilter = document.getElementById('category-filter');
            const statusFilter = document.getElementById('status-filter');
            
            if (searchInput) {
                searchInput.addEventListener('input', filterProducts);
            }
            
            if (categoryFilter) {
                categoryFilter.addEventListener('change', filterProducts);
            }
            
            if (statusFilter) {
                statusFilter.addEventListener('change', filterProducts);
            }
            
            // Load products from API
            loadProducts();
        });
        
        async function loadProducts() {
            const productsTable = document.getElementById('products-table');
            const tableBody = document.querySelector('tbody');
            
            // Show loading indicator
            tableBody.innerHTML = `
                <tr>
                    <td colspan="8" style="text-align: center; padding: 30px;">
                        <div class="loading-spinner">
                            <div class="spinner"></div>
                            <p>Loading products...</p>
                        </div>
                    </td>
                </tr>
            `;
            
            try {
                // Fetch products from API
                const response = await apiCall('/products');
                
                if (!response || !response.success) {
                    throw new Error('Failed to load products');
                }
                
                allProducts = response.data || [];
                
                if (allProducts.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="8" style="text-align: center; padding: 30px;">
                                <div class="empty-state">
                                    <i class="fas fa-box-open"></i>
                                    <h3>No Products Available</h3>
                                    <p>There are currently no products available. Please check back later.</p>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }
                
                // Populate category filter with unique categories
                const categories = [...new Set(allProducts.map(p => p.category))];
                const categoryFilter = document.getElementById('category-filter');
                
                // Clear existing options except first one
                while (categoryFilter.options.length > 1) {
                    categoryFilter.remove(1);
                }
                
                // Add new options
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category;
                    option.textContent = category;
                    categoryFilter.appendChild(option);
                });
                
                // Render products
                renderProducts(allProducts);
                
            } catch (error) {
                console.error('Error loading products:', error);
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 30px;">
                            <div class="error-container">
                                <p><i class="fas fa-exclamation-circle"></i> Failed to load products: ${error.message}</p>
                                <button class="btn" onclick="loadProducts()">Try Again</button>
                            </div>
                        </td>
                    </tr>
                `;
            }
        }
        
        function renderProducts(products) {
            const tableBody = document.querySelector('tbody');
            tableBody.innerHTML = '';
            
            products.forEach((product, index) => {
                const expiryDate = new Date(product.expiryDate);
                const today = new Date();
                const daysToExpiry = Math.ceil((expiryDate - today) / (1000 * 60 * 60 * 24));
                
                let statusClass = 'status-fresh';
                if (product.status === 'near_expiry') {
                    statusClass = 'status-near-expiry';
                } else if (product.status === 'expired') {
                    statusClass = 'status-expired';
                }
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${product.name}</td>
                    <td>${product.category}</td>
                    <td>${product.quantity}</td>
                    <td><span class="status-badge ${statusClass}">${product.status === 'near_expiry' ? 'Near Expiry' : 'Fresh'}</span></td>
                    <td>₹${product.price.toFixed(2)}</td>
                    <td>
                        <div class="quantity-controls">
                            <button class="quantity-btn" onclick="decreaseQuantity('${product._id}')"><i class="fas fa-minus"></i></button>
                            <input type="number" id="quantity-${product._id}" class="quantity-input" value="1" min="1" max="${product.quantity}">
                            <button class="quantity-btn" onclick="increaseQuantity('${product._id}', ${product.quantity})"><i class="fas fa-plus"></i></button>
                        </div>
                    </td>
                    <td>
                        <button class="buy-btn" onclick="addToCart('${product._id}')"><i class="fas fa-cart-plus"></i> Add</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }
        
        function filterProducts() {
            const searchText = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('category-filter').value;
            const status = document.getElementById('status-filter').value;
            
            const filteredProducts = allProducts.filter(product => {
                const matchesSearch = !searchText || 
                    product.name.toLowerCase().includes(searchText) || 
                    product.description.toLowerCase().includes(searchText);
                
                const matchesCategory = !category || product.category === category;
                
                const matchesStatus = !status || 
                    (status === 'Fresh' && product.status === 'fresh') ||
                    (status === 'Near Expiry' && product.status === 'near_expiry');
                
                return matchesSearch && matchesCategory && matchesStatus;
            });
            
            renderProducts(filteredProducts);
        }
        
        function increaseQuantity(id, maxQuantity) {
            const inputField = document.getElementById(`quantity-${id}`);
            let currentValue = parseInt(inputField.value);
            if (currentValue < maxQuantity) {
                inputField.value = currentValue + 1;
            }
        }

        function decreaseQuantity(id) {
            const inputField = document.getElementById(`quantity-${id}`);
            let currentValue = parseInt(inputField.value);
            if (currentValue > 1) {
                inputField.value = currentValue - 1;
            }
        }
        
        async function addToCart(productId) {
            const quantity = parseInt(document.getElementById(`quantity-${productId}`).value);
            
            // Check if user is logged in
            if (!isAuthenticated()) {
                alert('Please login to add items to your cart');
                window.location.href = 'login-signup.html';
                return;
            }
            
            try {
                // Find the product in our products array
                const product = allProducts.find(p => p._id === productId);
                
                if (!product) {
                    throw new Error('Product not found');
                }
                
                // Check if quantity is available
                if (product.quantity < quantity) {
                    alert(`Sorry, only ${product.quantity} units available for ${product.name}`);
                    return;
                }
                
                // Add to cart in localStorage
                let cart = JSON.parse(localStorage.getItem('cart') || '[]');
                
                // Check if product already in cart
                const existingItemIndex = cart.findIndex(item => item.productId === productId);
                
                if (existingItemIndex !== -1) {
                    // Check if total quantity exceeds available quantity
                    const newTotalQuantity = cart[existingItemIndex].quantity + quantity;
                    
                    if (newTotalQuantity > product.quantity) {
                        alert(`Cannot add more. You already have ${cart[existingItemIndex].quantity} in cart, and only ${product.quantity} are available.`);
                        return;
                    }
                    
                    // Update quantity
                    cart[existingItemIndex].quantity += quantity;
                } else {
                    // Add new item
                    cart.push({
                        productId: productId,
                        name: product.name,
                        price: product.price,
                        quantity: quantity,
                        category: product.category,
                        image: product.image || `https://via.placeholder.com/120x120?text=${encodeURIComponent(product.name)}`
                    });
                }
                
                // Save to localStorage
                localStorage.setItem('cart', JSON.stringify(cart));
                
                // Show success message
                const successMsg = document.createElement('div');
                successMsg.className = 'alert-success';
                successMsg.innerHTML = `
                    <div class="alert-content">
                        <i class="fas fa-check-circle"></i>
                        <span>${quantity} ${product.name} added to cart!</span>
                    </div>
                    <div class="alert-actions">
                        <button onclick="window.location.href='cart.html'">View Cart</button>
                        <button onclick="this.parentElement.parentElement.remove()">Continue Shopping</button>
                    </div>
                `;
                document.body.appendChild(successMsg);
                
                // Auto remove after 5 seconds
                setTimeout(() => {
                    if (successMsg.parentElement) {
                        successMsg.remove();
                    }
                }, 5000);
                
            } catch (error) {
                console.error('Add to cart error:', error);
                alert('Error adding item to cart: ' + error.message);
            }
        }
    </script>
</body>
</html>
